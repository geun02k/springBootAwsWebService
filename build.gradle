buildscript {
    ext { // build.gradle에서 사용하는 전역 변수 설정
        springBootVersion = '2.1.7.RELEASE'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        // 스프링 부트 그레이들 플러그인 추가 (Spring Boot 프로젝트를 빌드/실행/패키징하는 데 필요한 기능)
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

// 프로젝트에서 사용할 Gradle 플러그인 선언
// 자바와 스프링 부트를 사용하기 위한 필수 플러그인 (앞서 선언한 플러그인 의존성들 적용 여부 결정)
apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'
// 스프링 부트의 의존성들을 관리해주는 플러그인으로 필수!
apply plugin: 'io.spring.dependency-management'

group = 'com.book'
version = '1.0-SNAPSHOT'
// Gradle의 Java 플러그인이 제공하는 설정값 (Java 컴파일 기준 명시)
sourceCompatibility = 1.8

// 의존성(라이브러리)을 다운로드할 원격 저장소 지정
repositories {
    mavenCentral()
}

// 프로젝트에서 사용하는 의존성 선언
// Spring Boot의 dependency management가 관리하는 의존성은 버전을 직접 명시하지 않아도 관리되는 버전이 적용됨
dependencies {
    compile('org.springframework.boot:spring-boot-starter-mustache')
    compile('org.springframework.boot:spring-boot-starter-web')
    compile('org.springframework.boot:spring-boot-starter-data-jpa')
    compile('com.h2database:h2')
    compile('org.projectlombok:lombok')

    annotationProcessor('org.projectlombok:lombok')

    testCompile('org.springframework.boot:spring-boot-starter-test')
}